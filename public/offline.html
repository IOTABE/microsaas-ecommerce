<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f20" />
    <title>Sem conexão — MicroSaaS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background-color: #0a0f20;
        background-image:
          radial-gradient(900px 520px at 12% -8%, rgba(59, 130, 246, 0.18), transparent 60%),
          radial-gradient(820px 520px at 92% -4%, rgba(168, 85, 247, 0.15), transparent 58%);
        color: #e2e8f0;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 40px 28px;
        backdrop-filter: blur(16px);
        box-shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.9);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #1e3a8a, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        border: none;
        cursor: pointer;
        padding: 12px 28px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #1e3a8a, #2563eb);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Você está sem conexão</h1>
      <p>
        Não conseguimos carregar esta página agora. Verifique sua internet e tente novamente.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
