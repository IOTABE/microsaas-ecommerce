services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: microsaas-ecommerce:latest
    container_name: microsaas-app
    restart: unless-stopped

    # O PostgreSQL roda na máquina host (fora do Docker). Com "host network"
    # o container enxerga o banco em localhost:5432 diretamente — sem precisar
    # expor o Postgres na rede do Docker.
    network_mode: host

    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3000}
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/microsaas_db?schema=public}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}

    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://localhost:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

# ---------------------------------------------------------------------------
# Alternativa (sem host network), útil em macOS/Windows ou quando o Postgres
# não aceita conexões fora de localhost. Troque network_mode pelas linhas
# abaixo e use host.docker.internal na DATABASE_URL:
#
#    ports:
#      - "${APP_PORT:-3000}:3000"
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#
# e no Postgres (postgresql.conf) garanta: listen_addresses = '*'
# ---------------------------------------------------------------------------
